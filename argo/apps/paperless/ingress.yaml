apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless
  namespace: paperless
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
    # Autenticazione via PAPERLESS_ENABLE_HTTP_REMOTE_USER + header Authentik,
    # non forward-auth bloccante: preserva le integrazioni API/mobile.
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [paperless.mbianchi.me]
      secretName: paperless-tls
  rules:
    - host: paperless.mbianchi.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paperless
                port:
                  number: 8000
