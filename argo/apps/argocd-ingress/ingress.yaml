apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
    # ArgoCD usa gRPC — l'ingress deve fare passthrough TLS al server
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/ssl-passthrough: "false"
    # Autenticazione via Dex/OIDC (Authentik come identity provider) configurata
    # lato ArgoCD stesso, non tramite forward-auth: preserva argocd CLI/gRPC.
spec:
  ingressClassName: nginx
  tls:
    - hosts: [argo.mbianchi.me]
      secretName: argocd-tls
  rules:
    - host: argo.mbianchi.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
