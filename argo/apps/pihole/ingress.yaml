apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pihole
  namespace: pihole
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
    # Pi-hole web richiede /admin come path
    nginx.ingress.kubernetes.io/rewrite-target: /admin/$1
    # Accesso via Authentik forward-auth (domain-level) invece della whitelist VPN
    nginx.ingress.kubernetes.io/auth-url: "http://auth.mbianchi.me/outpost.goauthentik.io/auth/nginx"
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.mbianchi.me/outpost.goauthentik.io/start?rd=$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [pihole.mbianchi.me]
      secretName: pihole-tls
  rules:
    - host: pihole.mbianchi.me
      http:
        paths:
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: pihole-web
                port:
                  number: 80
