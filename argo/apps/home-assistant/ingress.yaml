apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant
  namespace: home-assistant
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Accesso gestito da una Cloudflare Access Application dedicata (vedi runbook,
    # Fase 4) invece della whitelist VPN o di Authentik — compatibile con la app
    # companion HA tramite Service Token.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket necessario per Home Assistant real-time
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [homeassistant.mbianchi.me]
      secretName: home-assistant-tls
  rules:
    - host: homeassistant.mbianchi.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant
                port:
                  number: 8123
